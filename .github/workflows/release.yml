name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-test:
    name: Build
    uses: ./.github/workflows/build.yml

  release:
    name: Create Release
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive version string
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from NEWS.md
        env:
          RELEASE_FOOTER: |

            ---
            Please check out the [information for users](https://github.com/bothlab/pomidaq#users) for using the
            prebuilt binaries and solutions to common issues users may encounter.
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract the block for this version from NEWS.md.
          # The block starts with "Version X.Y.Z" and ends before the next "Version " line.
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^Version / {
              if (found) exit
              if ($2 == ver) { found=1; next }
            }
            /^-+$/ && found && !body { next }
            found { body=1; print }
          ' NEWS.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::warning::No release notes found for version $VERSION in NEWS.md"
            echo "Release $VERSION" > release_notes.md
          fi

          printf '%s' "$RELEASE_FOOTER" >> release_notes.md

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets

          # Move the artifact directory itself as a ZIP for the Linux packages,
          # and copy the .exe directly for the Windows installer.
          for artifact_dir in artifacts/*/; do
            name=$(basename "$artifact_dir")
            case "$name" in
              *.debian-testing_*.zip)
                # CI-only build, not a release target
                echo "Skipping $name"
                ;;
              *.debian*.zip|*.ubuntu*.zip)
                zip -j "$GITHUB_WORKSPACE/release_assets/${name}" "$artifact_dir"/*.deb
                ;;
              *_setup_win64)
                cp "$artifact_dir"/*.exe release_assets/
                ;;
            esac
          done

          echo "Assets to upload:"
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Version ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: release_assets/*


  repo-publish:
    name: Publish to package repository
    needs: release
    runs-on: ubuntu-slim
    steps:
      - name: Install Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@v3
        with:
          api-key: ${{ secrets.CLOUDSMITH_KEY }}

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pomidaq_*
          path: artifacts

      - name: Upload packages to repository
        run: |
          count=0

          # Map the artifact labels of the build matrix to the
          # respective distribution suites of the Syntalos repository.
          for artifact_dir in artifacts/*/; do
            name=$(basename "$artifact_dir")
            case "$name" in
              *.debian13_*)
                target=debian/trixie
                ;;
              *.ubuntu26.04_*)
                target=ubuntu/resolute
                ;;
              *)
                echo "Skipping $name"
                continue
                ;;
            esac

            for deb in "$artifact_dir"/*.deb; do
              cloudsmith push deb --republish "syntalos/syntalos/$target" "$deb"
              count=$((count + 1))
            done
          done

          if [ "$count" -eq 0 ]; then
            echo "::error::No packages were uploaded to the repository."
            exit 1
          fi
